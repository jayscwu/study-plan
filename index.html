<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學習計畫進度追蹤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 登入畫面 -->
  <section id="login-view" class="login-view">
    <h1 class="login-title">學習計畫進度追蹤</h1>
    <p class="login-subtitle">請選擇使用者登入</p>

    <div id="login-users" class="login-users"></div>

    <div id="login-pin-panel" class="login-pin-panel hidden">
      <p id="login-selected-name" class="login-selected-name"></p>
      <input type="password" inputmode="numeric" id="login-pin-input" class="login-pin-input" placeholder="輸入 PIN 碼" maxlength="8">
      <p id="login-error" class="login-error hidden"></p>
      <div class="login-actions">
        <button id="login-back-btn" class="secondary-btn">返回</button>
        <button id="login-submit-btn" class="primary-btn">登入</button>
      </div>
    </div>

    <p id="login-load-error" class="login-error hidden"></p>
  </section>

  <!-- 主畫面 -->
  <div id="app-view" class="hidden">

    <header id="status-bar" class="status-bar">
      <button id="user-menu-trigger" class="status-bar-user">
        <span id="status-bar-avatar" class="login-user-avatar"></span>
        <span class="status-bar-user-text">
          <span id="status-bar-name" class="status-bar-name"></span>
          <span id="status-bar-version" class="status-bar-version"></span>
        </span>
      </button>
      <div class="status-bar-center">
        <span id="status-bar-view-title" class="status-bar-view-title"></span>
        <span id="status-bar-updated" class="status-bar-updated"></span>
      </div>
      <button id="refresh-btn" class="icon-btn" title="重新整理資料">⟳</button>
    </header>

    <div id="user-menu" class="user-menu hidden">
      <button id="logout-btn" class="secondary-btn">登出</button>
    </div>

    <!-- 家長：學生切換（三個頁籤共用） -->
    <section id="student-toolbar" class="student-toolbar hidden">
      <label for="student-select">檢視學生：</label>
      <select id="student-select" class="student-select"></select>
    </section>

    <nav class="main-nav" id="main-nav">
      <button class="nav-tab active" data-view="overview">儀表板</button>
      <button class="nav-tab" data-view="tasks">學習列表</button>
      <button class="nav-tab" id="nav-manage-btn" data-view="manage">任務管理</button>
    </nav>

    <main id="main-content">

      <section id="loading-state" class="state-panel">
        <div class="spinner"></div>
        <p>正在讀取學習計畫資料...</p>
      </section>

      <section id="error-state" class="state-panel hidden">
        <p class="error-icon">⚠️</p>
        <p id="error-message">讀取資料失敗，請確認網路連線或稍後再試。</p>
        <button id="retry-btn" class="retry-btn">重試</button>
      </section>

      <!-- 儀表板頁籤 -->
      <section id="view-overview" class="hidden">

        <section class="summary-card">
          <div class="summary-numbers">
            <div class="summary-item total">
              <span class="summary-value" id="stat-total">0</span>
              <span class="summary-label">總任務數</span>
            </div>
            <div class="summary-item done">
              <span class="summary-value" id="stat-done">0</span>
              <span class="summary-label">已完成</span>
            </div>
            <div class="summary-item progress">
              <span class="summary-value" id="stat-progress">0</span>
              <span class="summary-label">學習中</span>
            </div>
            <div class="summary-item todo">
              <span class="summary-value" id="stat-todo">0</span>
              <span class="summary-label">待執行</span>
            </div>
          </div>
          <div class="overall-progress">
            <div class="overall-progress-labels">
              <span>整體完成度</span>
              <span id="overall-percent">0%</span>
            </div>
            <div class="progress-bar-track">
              <div id="overall-progress-bar" class="progress-bar-fill" style="width:0%"></div>
            </div>
          </div>
        </section>

        <section class="overview-block" id="overdue-block">
          <div class="overview-block-header" id="overdue-header">
            <h2 class="panel-title">逾期<span id="overdue-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="overdue-list" class="task-list-mobile"></div>
          <p id="no-overdue" class="no-results hidden">目前沒有逾期的任務。</p>
        </section>

        <section class="overview-block" id="today-block">
          <div class="overview-block-header" id="today-header">
            <h2 class="panel-title">今日<span id="today-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="today-list" class="task-list-mobile"></div>
          <p id="no-today" class="no-results hidden">今天沒有排定任務。</p>
        </section>

        <section class="overview-block" id="tomorrow-block">
          <div class="overview-block-header" id="tomorrow-header">
            <h2 class="panel-title">明日<span id="tomorrow-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="tomorrow-list" class="task-list-mobile"></div>
          <p id="no-tomorrow" class="no-results hidden">明天沒有排定任務。</p>
        </section>

      </section>

      <!-- 學習列表頁籤 -->
      <section id="view-tasks" class="hidden">

        <section class="controls">
          <div class="status-filter" id="status-filter">
            <button class="filter-chip active" data-status="all">全部</button>
            <button class="filter-chip" data-status="0">待執行</button>
            <button class="filter-chip" data-status="1">學習中</button>
            <button class="filter-chip" data-status="2">已完成</button>
          </div>
          <input type="search" id="search-input" class="search-input" placeholder="搜尋章節、科目或任務...">
          <div class="mode-toggle" id="mode-toggle">
            <button class="mode-toggle-btn active" data-mode="list">列表</button>
            <button class="mode-toggle-btn" data-mode="calendar">日曆</button>
          </div>
        </section>

        <!-- 列表模式 -->
        <section id="list-mode">
          <section id="subjects-container" class="subjects-container"></section>
          <p id="no-results" class="no-results hidden">找不到符合條件的項目。</p>
        </section>

        <!-- 日曆模式 -->
        <section id="calendar-mode" class="hidden">
          <div class="calendar-header">
            <button id="calendar-prev" class="secondary-btn">‹ 上個月</button>
            <h2 id="calendar-month-label" class="calendar-month-label"></h2>
            <button id="calendar-next" class="secondary-btn">下個月 ›</button>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>

          <section id="calendar-day-detail" class="requests-panel hidden">
            <h2 class="panel-title" id="calendar-day-title"></h2>
            <div id="calendar-day-list" class="task-list-mobile"></div>
          </section>

          <section id="unscheduled-panel" class="requests-panel">
            <h2 class="panel-title">未排定日期</h2>
            <div id="unscheduled-list" class="task-list-mobile"></div>
            <p id="no-unscheduled" class="no-results hidden">沒有未排定日期的任務。</p>
          </section>
        </section>

      </section>

      <!-- 任務管理頁籤（家長專用） -->
      <section id="view-manage" class="hidden">

        <!-- 新增／編輯任務 -->
        <section id="task-form-panel" class="requests-panel">
          <h2 class="panel-title" id="task-form-title">新增任務</h2>
          <div class="request-form">
            <select id="task-student-select" class="student-select"><option value="">選擇學生</option></select>
            <select id="task-course-select" class="student-select"><option value="">選擇課程</option></select>
            <select id="task-unit-select" class="student-select" disabled><option value="">選擇單元</option></select>
          </div>
          <div class="request-form">
            <input type="text" id="task-name-input" class="student-select" placeholder="任務名稱（如：練習本、練習卷）">
            <input type="date" id="task-date-input" class="student-select">
            <select id="task-timeslot-select" class="student-select">
              <option value="整天">整天</option>
              <option value="上午">上午</option>
              <option value="下午">下午</option>
              <option value="晚上">晚上</option>
            </select>
          </div>
          <div class="request-form">
            <button id="task-submit-btn" class="primary-btn">新增任務</button>
            <button id="task-cancel-edit-btn" class="secondary-btn hidden">取消編輯</button>
          </div>
          <p id="task-form-message" class="login-error hidden"></p>
        </section>

        <!-- 待回報審核 -->
        <section id="pending-reports-panel" class="requests-panel">
          <h2 class="panel-title">待回報審核</h2>
          <div id="pending-reports-list" class="requests-list"></div>
          <p id="no-pending-reports" class="no-results hidden">目前沒有待審核的回報。</p>
        </section>

        <!-- 任務清單管理 -->
        <section id="manage-tasks-panel" class="requests-panel">
          <h2 class="panel-title">任務清單管理</h2>
          <div id="manage-tasks-list" class="requests-list"></div>
          <p id="no-manage-tasks" class="no-results hidden">這位學生目前沒有任務。</p>
        </section>

      </section>

    </main>

    <footer class="app-footer">
      <p>資料來源：Google Sheet ・ 僅供學習進度檢視</p>
    </footer>

  </div>

</div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
