<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學習計畫進度追蹤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 登入畫面 -->
  <section id="login-view" class="login-view">
    <h1 class="login-title">學習計畫進度追蹤</h1>
    <p class="login-subtitle">請選擇使用者登入</p>

    <div id="login-users" class="login-users"></div>

    <div id="login-pin-panel" class="login-pin-panel hidden">
      <p id="login-selected-name" class="login-selected-name"></p>
      <input type="password" inputmode="numeric" id="login-pin-input" class="login-pin-input" placeholder="輸入 PIN 碼" maxlength="8">
      <p id="login-error" class="login-error hidden"></p>
      <div class="login-actions">
        <button id="login-back-btn" class="secondary-btn">返回</button>
        <button id="login-submit-btn" class="primary-btn">登入</button>
      </div>
    </div>

    <p id="login-load-error" class="login-error hidden"></p>
  </section>

  <!-- 主畫面 -->
  <div id="app-view" class="hidden">

    <header id="status-bar" class="status-bar">
      <button id="user-menu-trigger" class="status-bar-user">
        <span id="status-bar-avatar" class="login-user-avatar"></span>
        <span class="status-bar-user-text">
          <span id="status-bar-name" class="status-bar-name"></span>
          <span id="status-bar-version" class="status-bar-version"></span>
        </span>
      </button>
      <div class="status-bar-center">
        <span id="status-bar-view-title" class="status-bar-view-title"></span>
        <span id="status-bar-updated" class="status-bar-updated"></span>
      </div>
      <button id="refresh-btn" class="icon-btn" title="重新整理資料">⟳</button>
    </header>

    <div id="user-menu" class="user-menu hidden">
      <button id="logout-btn" class="secondary-btn">登出</button>
    </div>

    <!-- 家長：學生切換（所有頁籤共用） -->
    <section id="student-toolbar" class="student-toolbar hidden">
      <label for="student-select">檢視學生：</label>
      <select id="student-select" class="student-select"></select>
    </section>

    <nav class="main-nav" id="main-nav">
      <button class="nav-tab active" data-view="overview">儀表板</button>
      <button class="nav-tab" data-view="progress">上課進度</button>
      <button class="nav-tab" id="nav-manage-btn" data-view="manage">任務管理</button>
    </nav>

    <main id="main-content">

      <section id="loading-state" class="state-panel">
        <div class="skeleton-block"></div>
        <div class="skeleton-block"></div>
        <div class="skeleton-block short"></div>
      </section>

      <section id="error-state" class="state-panel hidden">
        <p class="error-icon">⚠️</p>
        <p id="error-message">讀取資料失敗，請確認網路連線或稍後再試。</p>
        <button id="retry-btn" class="retry-btn">重試</button>
      </section>

      <!-- 儀表板頁籤 -->
      <section id="view-overview" class="hidden">

        <section id="review-banner" class="review-banner hidden">
          <span id="review-banner-text"></span>
          <button id="review-banner-btn" class="secondary-btn">前往審核</button>
        </section>

        <section class="summary-card">
          <div class="summary-numbers">
            <div class="summary-item total">
              <span class="summary-value" id="stat-total">0</span>
              <span class="summary-label">學習項目</span>
            </div>
            <div class="summary-item done">
              <span class="summary-value" id="stat-done">0</span>
              <span class="summary-label">上完課</span>
            </div>
            <div class="summary-item progress">
              <span class="summary-value" id="stat-progress">0</span>
              <span class="summary-label">學習中</span>
            </div>
            <div class="summary-item todo">
              <span class="summary-value" id="stat-todo">0</span>
              <span class="summary-label">待學習</span>
            </div>
          </div>
          <div class="overall-progress">
            <div class="overall-progress-labels">
              <span>整體上課進度</span>
              <span id="overall-percent">0%</span>
            </div>
            <div class="progress-bar-track">
              <div id="overall-progress-bar" class="progress-bar-fill" style="width:0%"></div>
            </div>
          </div>
        </section>

        <section class="overview-block" id="courses-block">
          <div class="overview-block-header" id="courses-header">
            <h2 class="panel-title">各科進度</h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div class="overview-block-body">
            <div class="stack-legend">
              <span><i class="legend-dot status-2"></i>上完課</span>
              <span><i class="legend-dot status-1"></i>學習中</span>
              <span><i class="legend-dot status-0"></i>待學習</span>
            </div>
            <div id="course-progress-list" class="course-progress-list"></div>
          </div>
        </section>

        <section class="overview-block" id="recent-block">
          <div class="overview-block-header" id="recent-header">
            <h2 class="panel-title">最近 7 天動態<span id="recent-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="recent-list" class="task-list-mobile"></div>
          <p id="no-recent" class="no-results hidden">最近 7 天沒有上課紀錄。</p>
        </section>

        <section class="overview-block" id="learning-block">
          <div class="overview-block-header" id="learning-header">
            <h2 class="panel-title">學習中<span id="learning-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="learning-list" class="task-list-mobile"></div>
          <p id="no-learning" class="no-results hidden">目前沒有學習中的項目。</p>
        </section>

        <section class="overview-block" id="overdue-block">
          <div class="overview-block-header" id="overdue-header">
            <h2 class="panel-title">逾期任務<span id="overdue-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="overdue-list" class="task-list-mobile"></div>
          <p id="no-overdue" class="no-results hidden">目前沒有逾期的任務。</p>
        </section>

        <section class="overview-block" id="today-block">
          <div class="overview-block-header" id="today-header">
            <h2 class="panel-title">今日任務<span id="today-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="today-list" class="task-list-mobile"></div>
          <p id="no-today" class="no-results hidden">今天沒有排定任務。</p>
        </section>

        <section class="overview-block" id="tomorrow-block">
          <div class="overview-block-header" id="tomorrow-header">
            <h2 class="panel-title">明日任務<span id="tomorrow-count" class="overview-count"></span></h2>
            <button class="subject-toggle" aria-label="展開/收合">▾</button>
          </div>
          <div id="tomorrow-list" class="task-list-mobile"></div>
          <p id="no-tomorrow" class="no-results hidden">明天沒有排定任務。</p>
        </section>

      </section>

      <!-- 上課進度頁籤 -->
      <section id="view-progress" class="hidden">
        <div id="progress-course-tabs" class="course-tabs"></div>
        <section id="progress-units" class="subjects-container"></section>
        <p id="no-progress-units" class="no-results hidden">這個課程還沒有單元。</p>
      </section>

      <!-- 任務管理頁籤（家長專用） -->
      <section id="view-manage" class="hidden">
        <div id="manage-course-tabs" class="course-tabs"></div>
        <section id="manage-tasks-tree"></section>
      </section>

    </main>

    <footer class="app-footer">
      <p>資料來源：Google Sheet ・ 僅供學習進度檢視</p>
    </footer>

    <button id="task-fab" class="task-fab hidden" aria-label="新增任務">+</button>

    <!-- 批次新增任務彈窗 -->
    <div id="task-modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h2 class="panel-title">新增任務</h2>
          <button id="modal-close-btn" class="icon-btn" aria-label="關閉">✕</button>
        </div>
        <div class="request-form">
          <select id="modal-student-select" class="student-select"></select>
          <select id="modal-course-select" class="student-select"></select>
          <select id="modal-unit-select" class="student-select"></select>
        </div>
        <div class="request-form">
          <input type="text" id="modal-task-name" class="student-select" placeholder="任務名稱（如：練習本、練習卷）">
          <input type="date" id="modal-task-date" class="student-select">
          <select id="modal-task-slot" class="student-select">
            <option value="整天">整天</option>
            <option value="上午">上午</option>
            <option value="下午">下午</option>
            <option value="晚上">晚上</option>
          </select>
        </div>
        <div class="request-form">
          <button id="modal-add-btn" class="primary-btn">新增</button>
          <button id="modal-done-btn" class="secondary-btn">完成</button>
        </div>
        <p id="modal-message" class="login-error hidden"></p>
      </div>
    </div>

  </div>

</div>

<div id="toast-container" class="toast-container"></div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
