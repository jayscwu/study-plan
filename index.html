<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學習計畫進度追蹤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 登入畫面 -->
  <section id="login-view" class="login-view">
    <h1 class="login-title">學習計畫進度追蹤</h1>
    <p class="login-subtitle">請選擇使用者登入</p>

    <div id="login-users" class="login-users"></div>

    <div id="login-pin-panel" class="login-pin-panel hidden">
      <p id="login-selected-name" class="login-selected-name"></p>
      <input type="password" inputmode="numeric" id="login-pin-input" class="login-pin-input" placeholder="輸入 PIN 碼" maxlength="8">
      <p id="login-error" class="login-error hidden"></p>
      <div class="login-actions">
        <button id="login-back-btn" class="secondary-btn">返回</button>
        <button id="login-submit-btn" class="primary-btn">登入</button>
      </div>
    </div>

    <p id="login-load-error" class="login-error hidden"></p>
  </section>

  <!-- 主畫面 -->
  <div id="app-view" class="hidden">

    <header class="app-header">
      <div class="header-top">
        <div>
          <h1>學習計畫進度追蹤</h1>
          <p id="course-name" class="course-name">載入中...</p>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="icon-btn" title="重新整理資料">⟳</button>
          <button id="logout-btn" class="icon-btn" title="登出">⏻</button>
        </div>
      </div>
      <p id="current-user" class="current-user"></p>

      <nav class="main-nav" id="main-nav">
        <button class="nav-tab active" data-view="dashboard">儀表板</button>
        <button class="nav-tab" data-view="requests">申請審核</button>
      </nav>
    </header>

    <main id="main-content">

      <section id="loading-state" class="state-panel">
        <div class="spinner"></div>
        <p>正在讀取學習計畫資料...</p>
      </section>

      <section id="error-state" class="state-panel hidden">
        <p class="error-icon">⚠️</p>
        <p id="error-message">讀取資料失敗，請確認網路連線或稍後再試。</p>
        <button id="retry-btn" class="retry-btn">重試</button>
      </section>

      <!-- 儀表板頁籤 -->
      <section id="view-dashboard" class="hidden">

        <!-- 家長：學生切換 -->
        <section id="student-toolbar" class="student-toolbar hidden">
          <label for="student-select">檢視學生：</label>
          <select id="student-select" class="student-select"></select>
        </section>

        <section class="summary-card">
          <div class="summary-numbers">
            <div class="summary-item total">
              <span class="summary-value" id="stat-total">0</span>
              <span class="summary-label">總任務數</span>
            </div>
            <div class="summary-item done">
              <span class="summary-value" id="stat-done">0</span>
              <span class="summary-label">已完成</span>
            </div>
            <div class="summary-item progress">
              <span class="summary-value" id="stat-progress">0</span>
              <span class="summary-label">學習中</span>
            </div>
            <div class="summary-item todo">
              <span class="summary-value" id="stat-todo">0</span>
              <span class="summary-label">待執行</span>
            </div>
          </div>
          <div class="overall-progress">
            <div class="overall-progress-labels">
              <span>整體完成度</span>
              <span id="overall-percent">0%</span>
            </div>
            <div class="progress-bar-track">
              <div id="overall-progress-bar" class="progress-bar-fill" style="width:0%"></div>
            </div>
          </div>
        </section>

        <section class="controls">
          <div class="status-filter" id="status-filter">
            <button class="filter-chip active" data-status="all">全部</button>
            <button class="filter-chip" data-status="0">待執行</button>
            <button class="filter-chip" data-status="1">學習中</button>
            <button class="filter-chip" data-status="2">已完成</button>
          </div>
          <input type="search" id="search-input" class="search-input" placeholder="搜尋章節、科目或任務...">
          <div class="mode-toggle" id="mode-toggle">
            <button class="mode-toggle-btn active" data-mode="list">列表</button>
            <button class="mode-toggle-btn" data-mode="calendar">日曆</button>
          </div>
        </section>

        <!-- 列表模式 -->
        <section id="list-mode">
          <section id="subjects-container" class="subjects-container"></section>
          <p id="no-results" class="no-results hidden">找不到符合條件的項目。</p>
        </section>

        <!-- 日曆模式 -->
        <section id="calendar-mode" class="hidden">
          <div class="calendar-header">
            <button id="calendar-prev" class="secondary-btn">‹ 上個月</button>
            <h2 id="calendar-month-label" class="calendar-month-label"></h2>
            <button id="calendar-next" class="secondary-btn">下個月 ›</button>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>

          <section id="calendar-day-detail" class="requests-panel hidden">
            <h2 class="panel-title" id="calendar-day-title"></h2>
            <div id="calendar-day-list" class="task-list-mobile"></div>
          </section>

          <section id="unscheduled-panel" class="requests-panel">
            <h2 class="panel-title">未排定日期</h2>
            <div id="unscheduled-list" class="task-list-mobile"></div>
            <p id="no-unscheduled" class="no-results hidden">沒有未排定日期的任務。</p>
          </section>
        </section>

      </section>

      <!-- 申請審核頁籤 -->
      <section id="view-requests" class="hidden">

        <!-- 學生：提出申請 -->
        <section id="submit-request-panel" class="requests-panel hidden">
          <h2 class="panel-title">申請變更狀態</h2>
          <input type="search" id="req-search-input" class="search-input req-search-input" placeholder="搜尋課程、科目、章節或任務...">
          <div id="req-search-results" class="requests-list req-search-results hidden"></div>
          <div class="request-form">
            <select id="req-course-select" class="student-select"><option value="">選擇課程</option></select>
            <select id="req-subject-select" class="student-select" disabled><option value="">選擇科目</option></select>
            <select id="req-chapter-select" class="student-select" disabled><option value="">選擇章節</option></select>
            <select id="req-task-select" class="student-select" disabled><option value="">選擇任務</option></select>
          </div>
          <div id="req-current-status" class="request-current-status hidden"></div>
          <div class="request-form">
            <select id="req-status-select" class="student-select" disabled>
              <option value="">選擇新狀態</option>
              <option value="0">待執行</option>
              <option value="1">學習中</option>
              <option value="2">已完成</option>
            </select>
            <button id="req-submit-btn" class="primary-btn" disabled>送出申請</button>
          </div>
          <p id="req-form-message" class="login-error hidden"></p>
        </section>

        <!-- 家長：待審核申請 -->
        <section id="requests-panel" class="requests-panel hidden">
          <h2 class="panel-title">待審核申請</h2>
          <div id="pending-requests-list" class="requests-list"></div>
          <p id="no-pending-requests" class="no-results hidden">目前沒有待審核的申請。</p>
        </section>

        <!-- 學生：我的申請紀錄 -->
        <section id="my-requests-panel" class="requests-panel hidden">
          <h2 class="panel-title">我的申請紀錄</h2>
          <div id="my-requests-list" class="requests-list"></div>
          <p id="no-my-requests" class="no-results hidden">目前沒有申請紀錄。</p>
        </section>

      </section>

    </main>

    <footer class="app-footer">
      <p>資料來源：Google Sheet ・ 僅供學習進度檢視</p>
    </footer>

  </div>

</div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
